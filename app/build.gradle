plugins {
    // This plugin is used to download the yamnet model file
    id 'de.undercouch.download'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
//apply plugin: 'kotlin-android-extensions'

android {
    compileSdk 34
    namespace "de.uol.neuropsy.senda"
    ndkVersion "25.2.9519653"
    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        applicationId "de.uol.neuropsy.senda"
        minSdkVersion 30
        targetSdkVersion 31
        versionCode 109
        versionName "1.3"
        setProperty("archivesBaseName", "SENDA-$versionName")
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            versionNameSuffix='0.9'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// import DownloadModels task
project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
project.ext.TEST_ASSET_DIR = projectDir.toString() + '/src/androidTest/assets'

apply from:'download_model.gradle'

dependencies {
    implementation project(':liblsl-Java')
    implementation files('libs/MovellaDotSdkCore_ANDROID_v2023.6.0_STABLE_RELEASE.aar')
    implementation("androidx.viewpager2:viewpager2:1.0.0")
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Mediapipe Library
    implementation 'com.google.mediapipe:tasks-audio:0.20230731'
    implementation "androidx.activity:activity-ktx:1.9.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0-alpha01"
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'


    // unit‐test deps
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.0"
    testImplementation "app.cash.turbine:turbine:0.12.1"
    testImplementation "io.mockk:mockk:1.13.5"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'// for ApplicationProvider

    // instrumented‐test deps
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    // coroutine test
// turbine for Flow testing
    testImplementation "app.cash.turbine:turbine:0.12.1"
// MockK for mocking
    testImplementation "io.mockk:mockk:1.13.5"
// AndroidX test for ApplicationProvider
    testImplementation "androidx.test:core:1.5.0"
}


