plugins {
    // This plugin is used to download the yamnet model file
    id 'de.undercouch.download'
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

def appVersionName = "1.3"

// AGP 9 removed setProperty("archivesBaseName") from defaultConfig.
// The replacement is the project-level base extension.
base {
    archivesName = "SENDA-${appVersionName}"
}

android {
    compileSdk 35
    namespace "de.uol.neuropsy.senda"
    // NDK r28+ compiles 16 KB ELF-aligned by default (Google Play requirement as of Nov 2025).
    // The CMakeLists.txt also carries explicit linker flags as a belt-and-suspenders measure.
    ndkVersion "28.0.12433566"
    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        applicationId "de.uol.neuropsy.senda"
        minSdkVersion 30
        targetSdkVersion 35
        versionCode 109
        versionName appVersionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: "keystore.jks"
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            versionNameSuffix='0.9'
        }
    }

    // AGP 9.0.1+ automatically 16 KB-zipaligns uncompressed .so files.
    // useLegacyPackaging is kept so that the Movella and MediaPipe prebuilt libs
    // (whose ELF segments are still 4 KB-aligned) are compressed into the APK and
    // extracted at install time — the only way they can load on 16 KB devices until
    // those SDKs ship 16 KB-aligned binaries.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// import DownloadModels task
project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
project.ext.TEST_ASSET_DIR = projectDir.toString() + '/src/androidTest/assets'

apply from:'download_model.gradle'

dependencies {
    implementation project(':liblsl-Java')
    implementation files('libs/MovellaDotSdkCore_ANDROID_v2023.6.0_STABLE_RELEASE.aar')
    implementation("androidx.viewpager2:viewpager2:1.0.0")
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Mediapipe Library — 0.10.14+ ships 16 KB-aligned native libs (old 0.20230731 did not)
    implementation 'com.google.mediapipe:tasks-audio:0.10.14'
    implementation "androidx.activity:activity-ktx:1.9.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0-alpha01"
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'


    // unit‐test deps
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.0"
    testImplementation "app.cash.turbine:turbine:0.12.1"
    testImplementation "io.mockk:mockk:1.13.5"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'// for ApplicationProvider

    // instrumented‐test deps
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    // coroutine test
// turbine for Flow testing
    testImplementation "app.cash.turbine:turbine:0.12.1"
// MockK for mocking
    testImplementation "io.mockk:mockk:1.13.5"
// AndroidX test for ApplicationProvider
    testImplementation "androidx.test:core:1.5.0"
}


